<h1 class="title">List Expressions</h1>
<p>
Determine which of the following are valid, type-checking OCaml
<code>list</code> expressions.
</p>

<ol class="org-ol">
<li><code>(1 :: 2 :: []) :: (3 :: [4])</code></li>
<li><code>((1 :: 2) :: []) :: (3 :: [])</code></li>
<li><code>1 :: 2 :: [3] :: 4 :: [5]</code></li>
<li><code>1 :: 2 :: [3] @ (4 :: [])</code></li>
<li><code>(1 :: 2) :: [3] @ (4 :: [])</code></li>
</ol>
