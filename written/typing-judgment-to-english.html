<h1 class="title">Typing Judgment to English</h1>
<p>
Consider the following typing judgment.
</p>

<p>
\[
\{ \texttt{s} : \texttt{string},\ \texttt{i} : \texttt{int} \} \vdash \texttt{s.[i]} : \texttt{char}
\]
</p>

<p>
Write down an English sentence which expresses the same thing as the
above typing judgment.
</p>
